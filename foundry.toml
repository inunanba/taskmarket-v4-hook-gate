[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
gas_limit = "300000000"
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read-write", path = "./deployments" }]

# Default profile never touches the network; the live-testnet fork suite is opt-in (FOUNDRY_PROFILE=fork).
no_match_path = "test/fork/*"

[profile.fork]
match_path = "test/fork/*"
no_match_path = "test/__none__/*"

[fuzz]
runs = 512
seed = "0x7a5c"

[rpc_endpoints]
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"
local = "http://127.0.0.1:8545"

[lint]
# block.timestamp comparisons are the point of expiry/staleness checks; sequencer skew is covered in THREAT_MODEL.md.
exclude_lints = ["block-timestamp"]
