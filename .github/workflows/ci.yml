name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: forge build
        run: forge build
      - name: forge test
        run: forge test
      - name: adapter tests
        run: cd adapter && npm ci && npm test
      - name: local end-to-end (anvil + mock Taskmarket)
        run: bash scripts/e2e-local.sh
